name: 版本变动自动编译

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 检测 pubspec.yaml 版本号是否变化
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: v
        run: |
          CUR=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/version: *([0-9.]+).*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：总是构建，版本取当前 pubspec
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CUR" >> "$GITHUB_OUTPUT"
            echo "prev=(manual)  cur=$CUR  -> changed=true"
          else
            PREV=$(git show HEAD^:pubspec.yaml 2>/dev/null | grep '^version:' | head -1 | sed -E 's/version: *([0-9.]+).*/\1/')
            echo "prev=$PREV  cur=$CUR"
            echo "changed=$([ "$PREV" = "$CUR" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
            echo "version=$CUR" >> "$GITHUB_OUTPUT"
          fi

  # 版本号变化时编译 Android APK + Web（ubuntu）
  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: flutter pub get

      - name: 运行测试
        run: flutter test

      - name: 构建 Android APK
        run: flutter build apk --release

      - name: 构建 Web 版
        run: flutter build web --release

      - name: 整理 Android/Web 产物
        run: |
          VER="${{ needs.check.outputs.version }}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/zuoye-fluter-android-v${VER}.apk" 2>/dev/null || true
          (cd build/web && zip -qr "../web-release.zip" .) 2>/dev/null && mv build/web-release.zip "release/zuoye-fluter-web-v${VER}.zip" || true
          ls -la release/

      - name: 上传 Android/Web 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-web
          path: release/**
          if-no-files-found: warn

  # 版本号变化时编译 Windows 版（需 Windows runner，Flutter 不能跨平台构建桌面版）
  build-windows:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows 版
        run: flutter build windows --release

      - name: 整理 Windows 产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $ver = "${{ needs.check.outputs.version }}"
          $src = "build\windows\x64\runner\Release"
          $zip = "release\zuoye-fluter-windows-v$ver.zip"
          if (Test-Path $src) {
            Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
            Get-ChildItem release
          } else {
            Write-Error "Windows 构建产物缺失: $src"
            exit 1
          }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/**
          if-no-files-found: warn

  # 汇总所有产物并发布 Release
  release:
    needs: [check, build, build-windows]
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Android/Web 产物
        uses: actions/download-artifact@v4
        with:
          name: android-web
          path: release/

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release/

      - name: 列出产物
        run: |
          find release -type f | sort
          ls -la release/

      - name: 生成发布说明（变更内容）
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## 小学作业生成器 v${{ needs.check.outputs.version }}（Flutter 版）"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 📝 本次更新内容（自 $PREV_TAG 起）"
              echo ""
              git log --oneline --no-merges "$PREV_TAG"..HEAD | sed 's/^/- /'
            else
              echo "### 📝 初始版本"
            fi
            echo ""
            echo "### 📦 下载"
            echo "- zuoye-fluter-windows-v${{ needs.check.outputs.version }}.zip（Windows 便携版，解压即用）"
            echo "- zuoye-fluter-android-v${{ needs.check.outputs.version }}.apk（Android，可直接安装）"
            echo "- zuoye-fluter-web-v${{ needs.check.outputs.version }}.zip（Web 版，解压后浏览器打开 index.html）"
          } > notes.md
          cat notes.md

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body_path: notes.md
          files: release/**
